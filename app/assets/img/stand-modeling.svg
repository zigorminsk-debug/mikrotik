<svg xmlns="http://www.w3.org/2000/svg" width="748" height="550" viewBox="0 0 748 550"><rect x="0" y="0" width="748" height="550" fill="#8a95a3" rx="0"/><rect x="1" y="1" width="746" height="548" fill="#eceff3" stroke="#5c6673" stroke-width="1"/><rect x="2" y="2" width="744" height="30" fill="#2f6fb5"/><text x="12" y="21" font-size="13" fill="#ffffff" font-weight='600' font-family='Segoe UI, Tahoma, sans-serif'>Стенд моделирования</text><text x="694" y="21" font-size="13" fill="#dce9f7" text-anchor="middle" font-family='Segoe UI, Tahoma, sans-serif'>—</text><text x="714" y="21" font-size="12" fill="#dce9f7" text-anchor="middle" font-family='Segoe UI, Tahoma, sans-serif'>□</text><text x="733" y="21" font-size="12" fill="#dce9f7" text-anchor="middle" font-family='Segoe UI, Tahoma, sans-serif'>✕</text><text x="24" y="24" font-size="14" fill="#1b2430" font-weight='600' font-family='Segoe UI, Tahoma, sans-serif'>Интерактивный стенд — моделирование конфигурации</text><rect x="24" y="52" width="330" height="320" fill="#ffffff" rx="6" stroke="#c3ccd7" stroke-width="1"/><text x="44" y="74" font-size="12" fill="#1b2430" font-weight='600' font-family='Segoe UI, Tahoma, sans-serif'>Задача:</text><text x="44" y="109" font-size="12" fill="#26344a" font-family='Segoe UI, Tahoma, sans-serif'>Тип провайдеров:</text><rect x="174" y="96" width="180" height="20" fill="#ffffff" rx="2" stroke="#8d99a8" stroke-width="1"/><text x="180" y="110" font-size="12" fill="#101820" font-family='Consolas, monospace'>PPPoE + DHCP</text><text x="44" y="139" font-size="12" fill="#26344a" font-family='Segoe UI, Tahoma, sans-serif'>Основной канал:</text><rect x="174" y="126" width="180" height="20" fill="#ffffff" rx="2" stroke="#8d99a8" stroke-width="1"/><text x="180" y="140" font-size="12" fill="#101820" font-family='Consolas, monospace'>PPPoE (ether1)</text><text x="44" y="169" font-size="12" fill="#26344a" font-family='Segoe UI, Tahoma, sans-serif'>Резервный:</text><rect x="174" y="156" width="180" height="20" fill="#ffffff" rx="2" stroke="#8d99a8" stroke-width="1"/><text x="180" y="170" font-size="12" fill="#101820" font-family='Consolas, monospace'>DHCP (ether2)</text><text x="44" y="199" font-size="12" fill="#26344a" font-family='Segoe UI, Tahoma, sans-serif'>LAN:</text><rect x="174" y="186" width="180" height="20" fill="#ffffff" rx="2" stroke="#8d99a8" stroke-width="1"/><text x="180" y="200" font-size="12" fill="#101820" font-family='Consolas, monospace'>192.168.88.0/24</text><text x="44" y="229" font-size="12" fill="#26344a" font-family='Segoe UI, Tahoma, sans-serif'>Гости:</text><rect x="174" y="216" width="180" height="20" fill="#ffffff" rx="2" stroke="#8d99a8" stroke-width="1"/><text x="180" y="230" font-size="12" fill="#101820" font-family='Consolas, monospace'>192.168.99.0/24</text><text x="44" y="259" font-size="12" fill="#26344a" font-family='Segoe UI, Tahoma, sans-serif'>VPN:</text><rect x="174" y="246" width="180" height="20" fill="#ffffff" rx="2" stroke="#8d99a8" stroke-width="1"/><text x="180" y="260" font-size="12" fill="#101820" font-family='Consolas, monospace'>WireGuard wg0</text><text x="44" y="289" font-size="12" fill="#26344a" font-family='Segoe UI, Tahoma, sans-serif'>Публикация:</text><rect x="174" y="276" width="180" height="20" fill="#ffffff" rx="2" stroke="#8d99a8" stroke-width="1"/><text x="180" y="290" font-size="12" fill="#101820" font-family='Consolas, monospace'>80→192.168.88.10:80</text><rect x="44" y="320" width="200" height="24" fill="#2f6fb5" rx="4" stroke="#245a95" stroke-width="1"/><text x="144" y="336" font-size="12" fill="#fff" text-anchor="middle" font-weight='600' font-family='Segoe UI, Tahoma, sans-serif'>Смоделировать настройки</text><rect x="252" y="320" width="80" height="24" fill="#e8ecf1" rx="4" stroke="#9aa5b3" stroke-width="1"/><text x="292" y="336" font-size="12" fill="#1b2430" text-anchor="middle" font-family='Segoe UI, Tahoma, sans-serif'>Сброс</text><rect x="370" y="52" width="350" height="320" fill="#f7fafc" rx="6" stroke="#c3ccd7" stroke-width="1"/><text x="390" y="74" font-size="12" fill="#1b2430" font-weight='600' font-family='Segoe UI, Tahoma, sans-serif'>Результат моделирования:</text><rect x="390" y="96" width="310" height="22" fill="#dbe3ec" stroke="#a9b4c2" stroke-width="1"/><text x="396" y="111" font-size="11.5" fill="#25324a" font-weight='600' font-family='Segoe UI, Tahoma, sans-serif'>Проверка</text><text x="616" y="111" font-size="11.5" fill="#25324a" font-weight='600' font-family='Segoe UI, Tahoma, sans-serif'>Статус</text><rect x="390" y="118" width="310" height="20" fill="#ffffff" stroke="#d7dde5" stroke-width="1"/><text x="396" y="132" font-size="11.5" fill="#1b2430" font-family='Segoe UI, Tahoma, sans-serif'>Пересечение подсетей</text><text x="616" y="132" font-size="11.5" fill="#0f8a3d" font-weight='600' font-family='Consolas, monospace'>OK</text><rect x="390" y="138" width="310" height="20" fill="#f3f6fa" stroke="#d7dde5" stroke-width="1"/><text x="396" y="152" font-size="11.5" fill="#1b2430" font-family='Segoe UI, Tahoma, sans-serif'>Конфликты портов</text><text x="616" y="152" font-size="11.5" fill="#0f8a3d" font-weight='600' font-family='Consolas, monospace'>OK</text><rect x="390" y="158" width="310" height="20" fill="#ffffff" stroke="#d7dde5" stroke-width="1"/><text x="396" y="172" font-size="11.5" fill="#1b2430" font-family='Segoe UI, Tahoma, sans-serif'>Failover distance</text><text x="616" y="172" font-size="11.5" fill="#0f8a3d" font-weight='600' font-family='Consolas, monospace'>OK</text><rect x="390" y="178" width="310" height="20" fill="#f3f6fa" stroke="#d7dde5" stroke-width="1"/><text x="396" y="192" font-size="11.5" fill="#1b2430" font-family='Segoe UI, Tahoma, sans-serif'>Masquerade WAN</text><text x="616" y="192" font-size="11.5" fill="#0f8a3d" font-weight='600' font-family='Consolas, monospace'>OK</text><rect x="390" y="198" width="310" height="20" fill="#ffffff" stroke="#d7dde5" stroke-width="1"/><text x="396" y="212" font-size="11.5" fill="#1b2430" font-family='Segoe UI, Tahoma, sans-serif'>DNS настроен</text><text x="616" y="212" font-size="11.5" fill="#0f8a3d" font-weight='600' font-family='Consolas, monospace'>OK</text><rect x="390" y="96" width="310" height="122" fill="none" stroke="#a9b4c2" stroke-width="1"/><text x="390" y="232" font-size="11" fill="#5a6678" font-family='Consolas, monospace'>Все проверки пройдены — конфигурация готова к применению.</text><rect x="24" y="392" width="700" height="130" fill="#1e293b" rx="6"/><text x="40" y="412" font-size="11.5" fill="#94a3b8" font-weight='600' font-family='Segoe UI, Tahoma, sans-serif'>Сгенерированная конфигурация RouterOS v7:</text><text x="40" y="432" font-size="10" fill="#4ade80" font-family='Consolas, monospace'>/interface bridge add name=bridge-lan</text><text x="40" y="447" font-size="10" fill="#4ade80" font-family='Consolas, monospace'>/ip address add address=192.168.88.1/24 interface=bridge-lan</text><text x="40" y="462" font-size="10" fill="#4ade80" font-family='Consolas, monospace'>/ip pool add name=pool-lan ranges=192.168.88.10-192.168.88.250</text><text x="40" y="477" font-size="10" fill="#4ade80" font-family='Consolas, monospace'>/ip dhcp-server add name=dhcp1 interface=bridge-lan address-pool=pool-lan disabled=no</text><text x="40" y="492" font-size="10" fill="#4ade80" font-family='Consolas, monospace'>/ip firewall nat add chain=srcnat out-interface-list=WAN action=masquerade</text><text x="40" y="515" font-size="11" fill="#5a6678" font-family='Consolas, monospace'>Нажмите «Отправить на роутер» — команды применятся на выбранную цель (реальную или виртуальную).</text></svg>