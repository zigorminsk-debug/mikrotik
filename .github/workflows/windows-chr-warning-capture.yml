name: Windows CHR network warning capture
on:
  push:
    paths:
      - '.github/workflows/windows-chr-warning-capture.yml'
      - 'windows/chr/network-warning.js'
      - 'tools/capture-chr-warning.js'
      - 'tools/capture-chr-warning.ps1'
      - 'tools/export-chr-warning.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Electron
        working-directory: windows
        run: npm install --no-audit --no-fund
      - name: Copy application
        working-directory: windows
        run: npm run copy
      - name: Display, capture and cancel the actual native warning
        shell: powershell
        run: |
          try { ./tools/capture-chr-warning.ps1 }
          catch {
            $text = $_.Exception.ToString() -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            Write-Output "::error title=Native dialog capture::$text"
            $log = Join-Path $env:RUNNER_TEMP 'chr-warning-error.log'
            if (Test-Path $log) {
              $details = (Get-Content -Raw $log) -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
              Write-Output "::notice title=Electron capture diagnostics::$details"
            }
            exit 1
          }
      - name: Export screenshot 0–9
        run: python tools/export-chr-warning.py 0
      - name: Export screenshot 10–19
        run: python tools/export-chr-warning.py 10
      - name: Export screenshot 20–29
        run: python tools/export-chr-warning.py 20
      - name: Export screenshot 30–39
        run: python tools/export-chr-warning.py 30
