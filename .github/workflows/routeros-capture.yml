# Проверка возможности получить оригинальные снимки из настоящей RouterOS CHR.
# Образ и WinBox скачиваются только на одноразовый GitHub runner, не хранятся в репозитории.
name: RouterOS capture feasibility
on:
  push:
    paths:
      - '.github/workflows/routeros-capture.yml'
      - 'tools/capture-routeros.py'
      - 'tools/export-capture.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated VM and display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xvfb xdotool scrot python3-pexpect unzip libxkbcommon-x11-0 libxcb-cursor0 libxcb-shape0 libxcb-xfixes0 libxcb-randr0 libxcb-render0 libxcb-shm0 libxcb1 libx11-xcb1 libxrender1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-xinput0 libxcb-util1 libgl1 libegl1 libopengl0 libfontconfig1
      - name: Fetch official RouterOS CHR and WinBox
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/routeros-capture" "$RUNNER_TEMP/routeros-capture/output"
          cd "$RUNNER_TEMP/routeros-capture"
          curl -fL --retry 2 -o chr.zip https://download.mikrotik.com/routeros/7.23.8/chr-7.23.8.img.zip
          unzip -o chr.zip
          curl -fL --retry 2 -o winbox.zip https://download.mikrotik.com/routeros/winbox/4.4/WinBox_Linux.zip
          unzip -o winbox.zip -d winbox
          find winbox -type f -maxdepth 3 -printf '%p\n'
      - name: Boot RouterOS CHR and capture WinBox
        run: |
          set -o pipefail
          /usr/bin/python3 tools/capture-routeros.py "$RUNNER_TEMP/routeros-capture" 2>&1 | tee "$RUNNER_TEMP/routeros-capture/output/capture.log"
      - name: Report diagnostics to check annotations
        if: failure()
        run: |
          /usr/bin/python3 - <<'PYDIAG'
          import pathlib, os, re
          for name in ('winbox.log',):
              extra = pathlib.Path(os.environ['RUNNER_TEMP']) / 'routeros-capture/output' / name
              if extra.exists():
                  text = extra.read_text(errors='replace')[-4000:].replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
                  print('::error title=WinBox runtime diagnostics::' + text)
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'routeros-capture/output/capture.log'
          if path.exists():
              data = path.read_text(errors='replace')[-3000:].replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
              print('::error title=Capture traceback::' + data)
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'routeros-capture/output/serial.log'
          if path.exists():
              data = re.sub(r'\x1b\[[0-9;?]*[A-Za-z]', '', path.read_text(errors='replace'))
              data = data[-1800:].replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
              print('::error title=RouterOS serial diagnostics::' + data)
          PYDIAG
      - name: Export experimental screenshot 0–9
        if: always()
        run: /usr/bin/python3 tools/export-capture.py 0
      - name: Export experimental screenshot 10–19
        if: always()
        run: /usr/bin/python3 tools/export-capture.py 10
      - name: Export experimental screenshot 20–29
        if: always()
        run: /usr/bin/python3 tools/export-capture.py 20
      - name: Upload capture and diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RouterOS-capture-experiment
          path: ${{ runner.temp }}/routeros-capture/output/
          if-no-files-found: warn
          retention-days: 7
