name: Windows physical discovery screenshot
on:
  push:
    branches: ['**'] # Tags run only Build and Android update; branch coverage is unchanged.
    paths:
      - '.github/workflows/windows-physical-screenshot.yml'
      - 'tools/capture-physical-discovery.js'
      - 'tools/export-physical-discovery.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Electron and copy real application
        shell: pwsh
        run: |
          Push-Location windows
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          npm run copy
          if ($LASTEXITCODE -ne 0) { throw 'Copy failed' }
          Pop-Location
      - name: Capture real discovery settings window with mocked adapter list
        shell: pwsh
        run: |
          ./windows/node_modules/.bin/electron.cmd tools/capture-physical-discovery.js
          if ($LASTEXITCODE -ne 0) { throw 'Electron screenshot failed' }
      - name: Export screenshot parts 0–9
        run: python tools/export-physical-discovery.py 0
      - name: Export screenshot parts 10–19
        run: python tools/export-physical-discovery.py 10
      - name: Export screenshot parts 20–29
        run: python tools/export-physical-discovery.py 20
