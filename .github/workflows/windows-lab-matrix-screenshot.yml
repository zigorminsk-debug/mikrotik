name: Windows VM connectivity matrix screenshot
on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/windows-lab-matrix-screenshot.yml'
      - 'tools/capture-lab-matrix.js'
      - 'tools/export-lab-matrix.py'
      - 'app/js/lab.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Electron and copy app
        shell: pwsh
        run: |
          Push-Location windows
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          npm run copy
          if ($LASTEXITCODE -ne 0) { throw 'Copy failed' }
          Pop-Location
      - name: Capture controls with mocked bridge, no VM or ping
        shell: pwsh
        run: |
          ./windows/node_modules/.bin/electron.cmd tools/capture-lab-matrix.js
          if ($LASTEXITCODE -ne 0) { throw 'Capture failed' }
      - name: Export screenshot 0–9
        run: python tools/export-lab-matrix.py 0
      - name: Export screenshot 10–19
        run: python tools/export-lab-matrix.py 10
      - name: Export screenshot 20–29
        run: python tools/export-lab-matrix.py 20
