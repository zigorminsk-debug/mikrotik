name: Font CI diagnostics
on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/font-ci-diagnostics.yml'
  workflow_dispatch:
    inputs:
      android_run:
        description: 'Completed Android test run number'
        required: true
      windows_run:
        description: 'Completed Chromium test run number'
        required: true
permissions:
  actions: read
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Summarize failed test steps on disposable runners
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ANDROID_RUN: ${{ inputs.android_run || '41321163061' }}
          WINDOWS_RUN: ${{ inputs.windows_run || '41321163110' }}
        shell: bash
        run: |
          set -euo pipefail
          for kind in ANDROID WINDOWS; do
            if [[ "$kind" == ANDROID ]]; then id="$ANDROID_RUN"; else id="$WINDOWS_RUN"; fi
            [[ "$id" =~ ^[0-9]+$ ]]
            gh run view "$id" --log-failed > "$RUNNER_TEMP/$kind.txt" 2>&1 || true
            python3 - "$RUNNER_TEMP/$kind.txt" "$kind" <<'PY'
          import re,sys
          lines=open(sys.argv[1],encoding='utf-8',errors='replace').read().splitlines()
          # Logs contain only the test/build steps of disposable runners; filter
          # away URLs and explicitly secret-like lines before emitting a tail.
          keep=[]
          for line in lines:
              low=line.lower()
              if any(w in low for w in ('https://','http://','token','password','authorization','secret','signature=')): continue
              if re.search(r'error|failed|exception|cannot|unable|traceback|script|exit|layout|font|uiautomator|emulator|notice|syntax',line,re.I): keep.append(line[-600:])
          text='\n'.join(keep[-25:])[-8000:].replace('%','%25').replace('\r','').replace('\n','%0A')
          print('::notice title='+sys.argv[2]+' failed step summary::'+text)
          PY
