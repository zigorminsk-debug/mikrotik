name: Isolated official WinBox MAC control
on:
  push:
    paths:
      - '.github/workflows/winbox-mac-control.yml'
      - 'tools/test-winbox-mac-control.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install disposable VM and GUI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xvfb xdotool python3-pexpect iproute2 unzip libxkbcommon-x11-0 libxcb-cursor0 libxcb-shape0 libxcb-xfixes0 libxcb-randr0 libxcb-render0 libxcb-shm0 libxcb1 libx11-xcb1 libxrender1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-xinput0 libxcb-util1 libgl1 libegl1 libopengl0 libfontconfig1
      - name: Fetch official CHR and WinBox
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/winbox-control/winbox"
          curl -fL --retry 2 -o "$RUNNER_TEMP/winbox-control/chr.zip" https://download.mikrotik.com/routeros/7.23.8/chr-7.23.8.img.zip
          echo 'ac01ec7c092f4cab8136212e8ebfd613e0a37844c406317fa228d1ad446ce62c  '"$RUNNER_TEMP/winbox-control/chr.zip" | sha256sum -c -
          unzip -o "$RUNNER_TEMP/winbox-control/chr.zip" -d "$RUNNER_TEMP/winbox-control"
          curl -fL --retry 2 -o "$RUNNER_TEMP/winbox-control/winbox.zip" https://download.mikrotik.com/routeros/winbox/4.4/WinBox_Linux.zip
          unzip -o "$RUNNER_TEMP/winbox-control/winbox.zip" -d "$RUNNER_TEMP/winbox-control/winbox"
          curl -fL --retry 2 -o "$RUNNER_TEMP/winbox-control/tik4net.tar.gz" https://codeload.github.com/danikf/tik4net/tar.gz/d4597fa04fcad3e96a9fcd51ddac499778344638
          echo '78ee97bbda547e835c329a66d9454417f696f356ba62b75e8f190deb077e896e  '"$RUNNER_TEMP/winbox-control/tik4net.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/winbox-control/tik4net.tar.gz" -C "$RUNNER_TEMP/winbox-control"
      - name: Build third-party read-only client only for comparison
        run: |
          dotnet publish tools/mac-readonly-ci/mac-readonly-ci.csproj -c Release -r linux-x64 --self-contained true -p:TikSource="$RUNNER_TEMP/winbox-control/tik4net-d4597fa04fcad3e96a9fcd51ddac499778344638" -o "$RUNNER_TEMP/winbox-control/helper"
      - name: Compare official and research clients without saving packet contents
        run: |
          set -euo pipefail
          ns='wb-control-ci'
          trap 'sudo ip netns del "$ns" || true; sudo rm -rf "$RUNNER_TEMP/winbox-control"' EXIT
          sudo ip netns add "$ns"
          sudo ip netns exec "$ns" ip link set lo up
          sudo ip netns exec "$ns" ip tuntap add dev tap0 mode tap
          sudo ip netns exec "$ns" ip addr add 192.0.2.1/24 dev tap0
          sudo ip netns exec "$ns" ip link set tap0 up
          # No veth, bridge or route to physical/external network.
          sudo ip netns exec "$ns" /usr/bin/python3 tools/test-winbox-mac-control.py "$RUNNER_TEMP/winbox-control"
