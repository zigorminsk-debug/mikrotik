# Research only: this does not bundle the candidate into the application.
name: Windows WinBox OCR row research
on:
  push:
    branches: ['**'] # Tags run only Build and Android update; branch coverage is unchanged.
    paths:
      - '.github/workflows/windows-winbox-ocr-research.yml'
      - 'tools/test-winbox-scheme-ocr.js'
      - 'tools/test-winbox-scheme-ocr.ps1'
      - 'tools/export-lab-scheme-winbox.py'
      - 'tools/winbox-ocr-ci.ps1'
      - 'tools/test-winbox-ocr-geometry.ps1'
      - 'tools/test-chr-isolated-example-dom.js'
      - 'tools/package*.json'
      - 'app/js/lab.js'
      - 'app/js/lab-sim.js'
      - 'app/index.html'
      - 'windows/chr/plan.js'
      - 'windows/chr/session.js'
      - 'windows/chr/console.js'
      - 'windows/chr/verify.js'
      - 'tools/windows/chr-supervisor.c'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        kind: [static]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch pinned QEMU installer, verify and extract without installing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'qemu-candidate'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $package = Join-Path $dir 'qemu-setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/dextoros/qemu-runtime/releases/download/qemu-11.1.0-20260811/qemu-w64-setup-20260811.exe' -OutFile $package
          $sha = (Get-FileHash -Algorithm SHA512 $package).Hash.ToLowerInvariant()
          if ($sha -ne '5bcf9eed634e8575a37b74f445af41a2fe4106da512d0c30c368301d4c105037fdfab40a5287367a28a957624cddebbc8c07e16c88ab6634f554cdf3d16bf543') { throw 'QEMU installer SHA-512 mismatch' }
          $dest = Join-Path $dir 'qemu'
          7z x -y "-o$dest" $package
          if ($LASTEXITCODE -ne 0) { throw 'Unable to extract QEMU installer' }
          $exe = @(Get-ChildItem -Recurse -File -Path $dest -Filter qemu-system-x86_64.exe)
          if ($exe.Count -ne 1) { throw 'Expected one QEMU executable' }
          & $exe[0].FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'QEMU failed to start' }
          "QEMU_EXE=$($exe[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $licenses = @(Get-ChildItem -Recurse -File -Path $dest | Where-Object { $_.Name -match '^(COPYING|LICENSE)' } | Select-Object -ExpandProperty FullName)
          Write-Output "::notice title=Extracted QEMU license files::$($licenses.Count)"
      - name: Obtain official CHR for isolated CI only
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'qemu-candidate'
          $zip = Join-Path $dir 'chr.zip'
          Invoke-WebRequest -Uri 'https://download.mikrotik.com/routeros/7.23.8/chr-7.23.8.img.zip' -OutFile $zip
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant() -ne 'ac01ec7c092f4cab8136212e8ebfd613e0a37844c406317fa228d1ad446ce62c') { throw 'CHR ZIP hash mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $dir 'chr')
          $img = @(Get-ChildItem -Recurse -File -Path (Join-Path $dir 'chr') -Filter '*.img')
          if ($img.Count -ne 1) { throw 'Expected one CHR image' }
          "CHR_IMAGE=$($img[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build Windows QEMU supervisor
        shell: pwsh
        run: |
          cl /nologo /O2 /W3 tools/windows/chr-supervisor.c "/Fo$env:RUNNER_TEMP/chr-supervisor.obj" /link "/OUT:$env:RUNNER_TEMP/chr-supervisor.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Supervisor compilation failed' }
      - name: Install test-only DOM dependencies
        shell: pwsh
        run: |
          npm ci --prefix tools --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency install failed' }
      - name: Download official WinBox 4.4 for this disposable runner
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'winbox-official'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $zip=Join-Path $dir 'winbox.zip'
          Invoke-WebRequest -Uri 'https://download.mikrotik.com/routeros/winbox/4.4/WinBox_Windows.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          $exe=@(Get-ChildItem -Recurse -File -Path $dir -Filter 'WinBox.exe')
          if ($exe.Count -ne 1) { throw 'Expected one official WinBox executable' }
          "WINBOX_EXE=$($exe[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test OCR selector against synthetic positive and negative cases
        shell: pwsh
        run: ./tools/test-winbox-ocr-geometry.ps1
      - name: Apply selected scheme and capture original WinBox
        env:
          CI_SCHEME_KIND: ${{ matrix.kind }}
          CI_INPUT_METHOD: postmessage
          CI_BACKGROUND_NAV: "1"
          CI_DETAIL_NAV: "1"
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'qemu-candidate'
          node tools/test-winbox-scheme-ocr.js "$env:QEMU_EXE" "$env:CHR_IMAGE" (Join-Path $dir 'scheme-sessions') (Join-Path $env:RUNNER_TEMP 'chr-supervisor.exe') "$env:WINBOX_EXE"
          if ($LASTEXITCODE -ne 0) { throw 'Scheme WinBox research failed' }
      # On OCR failure export only the disposable, authenticated fixture's
      # address-list screenshot, not the login screen or arbitrary user data.
      - name: Export fixture address screenshot after failure 0–9
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'lab-scheme-winbox.jpg')) { python tools/export-lab-scheme-winbox.py 0 address; if ($LASTEXITCODE -ne 0) { throw 'Address export failed' } }
      - name: Export fixture address screenshot after failure 10–19
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'lab-scheme-winbox.jpg')) { python tools/export-lab-scheme-winbox.py 10 address; if ($LASTEXITCODE -ne 0) { throw 'Address export failed' } }
      - name: Export fixture address screenshot after failure 20–23
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'lab-scheme-winbox.jpg')) { python tools/export-lab-scheme-winbox.py 20 address; if ($LASTEXITCODE -ne 0) { throw 'Address export failed' } }
      - name: Export detail screenshot 0–9
        run: python tools/export-lab-scheme-winbox.py 0 detail
      - name: Export detail screenshot 10–19
        run: python tools/export-lab-scheme-winbox.py 10 detail
      - name: Export detail screenshot 20–23
        run: python tools/export-lab-scheme-winbox.py 20 detail
