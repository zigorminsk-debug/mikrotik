name: Windows WinBox login control research
on:
  push:
    paths:
      - '.github/workflows/windows-winbox-login-research.yml'
      - 'tools/capture-winbox-login-ci.ps1'
      - 'tools/export-winbox-login-ci.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Obtain official WinBox for isolated research
        shell: pwsh
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'winbox-official';New-Item -ItemType Directory -Force $dir | Out-Null
          $zip=Join-Path $dir 'winbox.zip'
          Invoke-WebRequest -Uri 'https://download.mikrotik.com/routeros/winbox/4.4/WinBox_Windows.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          $exe=@(Get-ChildItem -Recurse -File -Path $dir -Filter 'WinBox.exe')
          if($exe.Count -ne 1){throw 'Expected one WinBox executable'}
          "WINBOX_EXE=$($exe[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Capture login window without credentials
        shell: pwsh
        run: ./tools/capture-winbox-login-ci.ps1
      - name: Export 0–9
        run: python tools/export-winbox-login-ci.py 0
      - name: Export 10–19
        run: python tools/export-winbox-login-ci.py 10
      - name: Export 20–29
        run: python tools/export-winbox-login-ci.py 20
      - name: Export 30–39
        run: python tools/export-winbox-login-ci.py 30
