name: Windows diagram export verification
on:
  push:
    paths:
      - '.github/workflows/windows-export.yml'
      - 'app/js/lab-export.js'
      - 'app/js/lab.js'
      - 'app/index.html'
      - 'app/vendor/gifenc/**'
      - 'tools/test-export-electron.js'
      - 'tools/package*.json'
      - 'windows/main.js'
      - 'windows/preload.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test dependencies
        working-directory: tools
        shell: pwsh
        run: npm install --no-audit --no-fund
      - name: Install Electron
        working-directory: windows
        shell: pwsh
        run: npm install --no-audit --no-fund
      - name: Copy application
        working-directory: windows
        run: npm run copy
      - name: Render and decode PNG and animated GIF in Windows Electron
        shell: pwsh
        run: |
          ./windows/node_modules/.bin/electron.cmd tools/test-export-electron.js
          if ($LASTEXITCODE -ne 0) { throw 'Diagram export test failed' }
      - name: Export original Windows screenshot 0–9
        run: python tools/export-diagram-screenshot.py 0
      - name: Export original Windows screenshot 10–19
        run: python tools/export-diagram-screenshot.py 10
      - name: Export original Windows screenshot 20–29
        run: python tools/export-diagram-screenshot.py 20
      - name: Export original Windows screenshot 30–39
        run: python tools/export-diagram-screenshot.py 30
