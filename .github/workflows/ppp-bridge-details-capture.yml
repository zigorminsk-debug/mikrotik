# CI-only: fixed disposable RouterOS, never a user's device or configuration.
name: PPP and Bridge WinBox detail research
on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/ppp-bridge-details-capture.yml'
      - 'tools/capture-ppp-bridge-details.py'
      - 'tools/export-ppp-bridge.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and graphical capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xvfb xdotool scrot python3-pexpect unzip libxkbcommon-x11-0 libxcb-cursor0 libxcb-shape0 libxcb-xfixes0 libxcb-randr0 libxcb-render0 libxcb-shm0 libxcb1 libx11-xcb1 libxrender1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-xinput0 libxcb-util1 libgl1 libegl1 libopengl0 libfontconfig1
      - name: Obtain official CHR and WinBox on temporary runner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/routeros-capture/output"
          cd "$RUNNER_TEMP/routeros-capture"
          curl -fL --retry 2 -o chr.zip https://download.mikrotik.com/routeros/7.23.8/chr-7.23.8.img.zip
          echo 'ac01ec7c092f4cab8136212e8ebfd613e0a37844c406317fa228d1ad446ce62c  chr.zip' | sha256sum -c -
          unzip -o chr.zip
          curl -fL --retry 2 -o winbox.zip https://download.mikrotik.com/routeros/winbox/4.4/WinBox_Linux.zip
          unzip -o winbox.zip -d winbox
      - name: Capture only disposable empty forms
        run: /usr/bin/python3 tools/capture-ppp-bridge-details.py "$RUNNER_TEMP/routeros-capture"
      - name: Export PPP screenshot 0–9
        run: python3 tools/export-ppp-bridge.py ppp 0
      - name: Export PPP screenshot 10–19
        run: python3 tools/export-ppp-bridge.py ppp 10
      - name: Export PPP screenshot 20–29
        run: python3 tools/export-ppp-bridge.py ppp 20
      - name: Export Bridge screenshot 0–9
        run: python3 tools/export-ppp-bridge.py bridge 0
      - name: Export Bridge screenshot 10–19
        run: python3 tools/export-ppp-bridge.py bridge 10
      - name: Export Bridge screenshot 20–29
        run: python3 tools/export-ppp-bridge.py bridge 20
