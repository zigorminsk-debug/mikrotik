name: Windows CHR downloader
on:
  push:
    paths:
      - '.github/workflows/windows-chr-download.yml'
      - 'windows/chr/download.js'
      - 'tools/test-chr-download-integration.js'
      - 'tools/package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install production download dependency
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'chr-npm.log'
          Push-Location windows
          npm install --omit=dev --ignore-scripts --no-audit --no-fund *> $log
          Pop-Location
          if ($LASTEXITCODE -ne 0) {
            $text = ((Get-Content -Raw $log) -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
            Write-Output "::error title=CHR npm diagnostic::$text"
            throw 'Dependency installation failed'
          }
      - name: Verify official download and cache
        shell: pwsh
        run: |
          $env:NODE_PATH = (Join-Path $env:GITHUB_WORKSPACE 'windows/node_modules')
          $log = Join-Path $env:RUNNER_TEMP 'chr-download-test.log'
          node tools/test-chr-download-integration.js (Join-Path $env:RUNNER_TEMP 'chr-download-cache') *> $log
          if ($LASTEXITCODE -ne 0) {
            $text = ((Get-Content -Raw $log) -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
            Write-Output "::error title=CHR download diagnostic::$text"
            throw 'Application CHR download test failed'
          }
          Get-Content $log
