name: Android selected-version replacement check
on:
  push:
    tags: ['v1.19.2']
    branches: ['arena/**']
    paths:
      - '.github/workflows/android-replacement-1201.yml'
      - 'tools/test-android-replacement.sh'
permissions:
  contents: read
jobs:
  replacement:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Save the existing 1.20.1 APK before cleanup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/old" "$RUNNER_TEMP/new"
          gh release download v1.20.1 -p 'MikroTik-Guide-v1.20.1.apk' -D "$RUNNER_TEMP/old"
          echo "OLD_APK=$RUNNER_TEMP/old/MikroTik-Guide-v1.20.1.apk" >> "$GITHUB_ENV"
      - name: Wait for 1.19.2 to be published
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS+2100))
          while ((SECONDS<deadline)); do
            if [[ "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)" == v1.19.2 ]]; then
              gh release download v1.19.2 -p 'MikroTik-Guide-v1.19.2.apk' -D "$RUNNER_TEMP/new"
              echo "NEW_APK=$RUNNER_TEMP/new/MikroTik-Guide-v1.19.2.apk" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 30
          done
          echo '::error::The selected version was not published as latest within 35 minutes.'
          exit 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Configure KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify replacement on disposable emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: bash tools/test-android-replacement.sh
