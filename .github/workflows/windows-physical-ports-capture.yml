name: Windows manual port comparison screenshots
on:
  push:
    paths:
      - '.github/workflows/windows-physical-ports-capture.yml'
      - 'tools/capture-physical-ports.js'
      - 'tools/export-physical-ports.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Electron and copy application
        shell: pwsh
        run: |
          Push-Location windows
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          npm run copy
          if ($LASTEXITCODE -ne 0) { throw 'Copy failed' }
          Pop-Location
      - name: Capture manual entry and comparison (no device or network)
        shell: pwsh
        run: |
          ./windows/node_modules/.bin/electron.cmd tools/capture-physical-ports.js
          if ($LASTEXITCODE -ne 0) { throw 'Electron screenshot failed' }
      - name: Export entry 0–9
        run: python tools/export-physical-ports.py 0 entry
      - name: Export entry 10–19
        run: python tools/export-physical-ports.py 10 entry
      - name: Export entry 20–23
        run: python tools/export-physical-ports.py 20 entry
      - name: Export result 0–9
        run: python tools/export-physical-ports.py 0 result
      - name: Export result 10–19
        run: python tools/export-physical-ports.py 10 result
      - name: Export result 20–23
        run: python tools/export-physical-ports.py 20 result
