# Disposable CHR research only; serial markers and HTTPS pinning are not a production connector.
name: Audit read-only HTTPS research
on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/audit-rest-readonly-research.yml'
      - 'windows/audit/**'
      - 'tools/test-audit-rest-readonly.js'
      - 'tools/test-audit-report.js'
      - 'tools/test-audit-ipc-handler.js'
      - 'tools/test-audit-import-plan.js'
      - 'tools/test-audit-compare.js'
      - 'tools/test-audit-ui.js'
      - 'app/js/physical-audit.js'
      - 'tools/test-audit-rest-chr-ci.js'
      - 'tools/test-audit-rest-chr-ci.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install DOM test dependencies
        run: npm ci --prefix tools --no-audit --no-fund
      - name: Verify TLS pinning and allowlist with local fake server
        run: |
          node tools/test-audit-rest-readonly.js
          node tools/test-audit-report.js
          node tools/test-audit-ipc-handler.js
          node tools/test-audit-import-plan.js
          node tools/test-audit-compare.js
          node tools/test-audit-ui.js
      - name: Install QEMU and console tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 python3-pexpect unzip
      - name: Obtain official disposable CHR
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit-chr"
          cd "$RUNNER_TEMP/audit-chr"
          curl -fL --retry 2 -o chr.zip https://download.mikrotik.com/routeros/7.23.8/chr-7.23.8.img.zip
          echo 'ac01ec7c092f4cab8136212e8ebfd613e0a37844c406317fa228d1ad446ce62c  chr.zip' | sha256sum -c -
          unzip -o chr.zip
      - name: Read only fixture data from disposable CHR over pinned HTTPS
        run: /usr/bin/python3 tools/test-audit-rest-chr-ci.py "$RUNNER_TEMP/audit-chr"
