# Сборка приложений на GitHub Actions:
#   • test      — синтаксис JS + модульные тесты стенда
#   • android   — подписанный APK (постоянный ключ из android/keystore/)
#   • windows   — установщик NSIS (MikroTik-Guide-Setup-x.y.z.exe)
#   • release   — при пуше тега vX.Y.Z создаёт релиз с артефактами
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Тесты стенда и контента
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Синтаксис JS
        run: |
          set -e
          for f in app/js/*.js tools/*.js; do node --check "$f"; done
          echo "syntax OK"
      - name: Генерация скриншотов (детерминированность)
        run: |
          node tools/gen-screens.js
          git diff --exit-code -- app/assets/img || {
            echo "::error::SVG-скриншоты отличаются от закоммиченных. Запустите node tools/gen-screens.js и закоммитьте."
            exit 1
          }
      - name: Модульные тесты
        run: node tools/test-stand.js
      - name: Тесты протокола RouterOS API
        run: node tools/test-mt.js
      - name: DOM-тест (интерактивный стенд, шрифт, автодополнение)
        run: |
          npm install --prefix tools --no-audit --no-fund
          node tools/test-dom.js

  android:
    name: Android APK (подписанный)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Сборка release APK
        run: gradle -p android assembleRelease --stacktrace
      - name: Проверка подписи APK
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" | head -20
      # APK в артефакты НЕ выкладываем: GitHub всегда упаковывает артефакты в zip,
      # а пользователю нужен чистый .apk. Он доступен напрямую:
      #  - в релизе: releases/download/<тег>/MikroTik-Guide-<тег>.apk
      #  - в дереве: releases/MikroTik-Guide.apk (перезаписывается шагом ниже)
      - name: Выложить чистый APK в репозиторий (releases/MikroTik-Guide.apk)
        if: github.ref_type == 'branch'
        run: |
          set -e
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p releases
          rm -f releases/*.apk
          cp "$APK" releases/MikroTik-Guide.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/MikroTik-Guide.apk
          if git diff --cached --quiet; then
            echo "APK не изменился — коммит не требуется"
            exit 0
          fi
          git commit -m "chore: обновить releases/MikroTik-Guide.apk (CI build $GITHUB_RUN_NUMBER)"
          for i in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "APK выложен в репозиторий: releases/MikroTik-Guide.apk"
              break
            fi
            echo "push не удался, повтор $i..."
            sleep 5
          done
      - name: Загрузить APK как артефакт Actions (для GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: MikroTik-Guide-Android
          path: android/app/build/outputs/apk/release/*.apk

  windows:
    name: Windows-установщик
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Установка зависимостей
        run: npm install --no-audit --no-fund
      - name: Сборка установщика (electron-builder)
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: MikroTik-Guide-Windows
          path: windows/dist/*.exe
          if-no-files-found: error

  release:
    name: Публикация релиза
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Имена файлов релиза (чистый APK, без упаковки)
        run: |
          set -e
          mkdir -p out
          for f in dist/*.apk; do
            [ -e "$f" ] || continue
            cp "$f" "out/MikroTik-Guide-${GITHUB_REF_NAME}.apk"
          done
          for f in dist/*.exe; do
            [ -e "$f" ] || continue
            cp "$f" "out/$(basename "$f")"
          done
          ls -la out/
      - uses: softprops/action-gh-release@v2
        with:
          name: MikroTik Guide ${{ github.ref_name }}
          files: out/*
          generate_release_notes: true
