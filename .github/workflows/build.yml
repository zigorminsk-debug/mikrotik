# Сборка приложений на GitHub Actions:
#   • test      — синтаксис JS + модульные тесты стенда
#   • android   — подписанный APK (постоянный ключ из android/keystore/)
#   • windows   — установщик NSIS (MikroTik-Guide-Setup-x.y.z.exe)
#   • release   — при пуше тега vX.Y.Z создаёт релиз с артефактами
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Тесты стенда и контента
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Синтаксис JS
        run: |
          set -e
          for f in app/js/*.js tools/*.js; do node --check "$f"; done
          echo "syntax OK"
      - name: Генерация схемы сети (детерминированность)
        run: |
          node tools/gen-screens.js
          git diff --exit-code -- app/assets/img || {
            echo "::error::Схема сети отличается от закоммиченной. Запустите node tools/gen-screens.js и закоммитьте."
            exit 1
          }
      - name: Модульные тесты
        run: node tools/test-stand.js
      - name: Актуальность инвентаризации снимков и истории выпусков
        run: |
          node tools/audit-screens.js --check
          node tools/generate-release-history.js --check
      - name: Тесты графической лаборатории
        run: node tools/test-lab.js
      - name: Тесты консоли и проверки виртуальной CHR
        run: |
          node tools/test-chr-console.js
          node tools/test-chr-plan.js
          node tools/test-chr-verify.js
          node tools/test-chr-session-unit.js
          node tools/test-chr-online.js
          node tools/test-chr-main.js
          node tools/test-chr-wireguard-verify.js
          node tools/test-physical-mndp.js
          node tools/test-open-winbox.js
          node tools/test-physical-preview.js
          node tools/test-workflow-triggers.js
      - name: DOM-тест (интерактивный стенд, шрифт, автодополнение)
        run: |
          npm install --prefix tools --no-audit --no-fund
          NODE_PATH=tools/node_modules node tools/test-chr-download.js
          node tools/test-dom.js
          node tools/test-about.js
          node tools/test-lab-dom.js
          node tools/test-guide-lab.js
          node tools/test-chr-dual-wan-dom.js
          node tools/test-chr-isolated-example-dom.js
          node tools/test-physical-dom.js
          node tools/test-physical-preview-dom.js

  android:
    name: Android APK (подписанный)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Сборка release APK
        run: gradle -p android assembleRelease --stacktrace
      - name: Проверка подписи APK
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          signature=$($ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK")
          echo "$signature"
          echo "$signature" | grep -qi 'Signer #1 certificate SHA-256 digest: 71a7bab089b395259e0c9980130652c5f996319892a928b1e4a5025ab602d31a'
          code=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]\+\([0-9]\+\).*/\1/p' android/app/build.gradle)
          version=$(node -p "require('./windows/package.json').version")
          badging=$($ANDROID_HOME/build-tools/34.0.0/aapt dump badging "$APK")
          printf '%s\n' "${badging%%$'\n'*}"
          grep -Fq "package: name='by.mikrotik.tutor' versionCode='$code' versionName='$version'" <<< "$badging"
      # Только для передачи между job при сборке тега. Пользователь скачивает
      # из GitHub Release чистый APK, не архив Actions.
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: MikroTik-Guide-Android-internal
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1
      - name: Выложить чистый APK в репозиторий (releases/MikroTik-Guide.apk)
        if: github.ref_type == 'branch'
        run: |
          set -e
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p releases
          rm -f releases/*.apk
          cp "$APK" releases/MikroTik-Guide.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/MikroTik-Guide.apk
          if git diff --cached --quiet; then
            echo "APK не изменился — коммит не требуется"
            exit 0
          fi
          git commit -m "chore: обновить releases/MikroTik-Guide.apk (CI build $GITHUB_RUN_NUMBER)"
          for i in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "APK выложен в репозиторий: releases/MikroTik-Guide.apk"
              break
            fi
            echo "push не удался, повтор $i..."
            sleep 5
          done

  windows:
    name: Windows-установщик
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Установка зависимостей
        run: npm install --no-audit --no-fund
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mikrotik-qemu-cache
          key: windows-qemu-sources-11.1.0-20260811-v1
      - name: Подготовка QEMU, исходников и защитного супервизора
        shell: pwsh
        run: ./scripts/prepare-qemu.ps1
      - name: Сборка установщика (electron-builder)
        run: npm run dist
      - name: Проверка установленного приложения и компонентов
        shell: pwsh
        run: ./scripts/smoke-packaged.ps1
      # Branch builds still compile and smoke-test the installer, but only tag
      # builds need to transfer its >1 GB artifact to the release job.
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          compression-level: 0 # EXE is already compressed; avoid recompressing it.
          name: MikroTik-Guide-Windows
          path: windows/dist/*.exe
          if-no-files-found: error

  release:
    name: Публикация релиза
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка тега и версии
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          node -e "const fs=require('fs'); const tag=process.env.GITHUB_REF_NAME.slice(1); const gradle=fs.readFileSync('android/app/build.gradle','utf8'); const app=fs.readFileSync('app/js/version.js','utf8'); if (require('./windows/package.json').version!==tag || !gradle.includes('versionName \"'+tag+'\"') || !app.includes(\"APP_VERSION = '\"+tag+\"'\")) process.exit(1)"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Имена файлов релиза (чистый APK, без упаковки)
        run: |
          set -e
          mkdir -p out
          shopt -s nullglob
          apks=(dist/*.apk)
          exes=(dist/*.exe)
          test "${#apks[@]}" -eq 1
          test "${#exes[@]}" -eq 1
          test "$(basename "${exes[0]}")" = "MikroTik-Guide-Setup-${GITHUB_REF_NAME#v}.exe"
          cp "${apks[0]}" "out/MikroTik-Guide-${GITHUB_REF_NAME}.apk"
          cp "${exes[0]}" out/
          ls -la out/
      - uses: softprops/action-gh-release@v2
        with:
          name: MikroTik Guide ${{ github.ref_name }}
          draft: true # Publish only after checking both assets and CI.
          fail_on_unmatched_files: true
          files: out/*
          generate_release_notes: true
