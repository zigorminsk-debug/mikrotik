# Сборка приложений на GitHub Actions:
#   • test      — синтаксис JS + модульные тесты стенда
#   • android   — подписанный APK (постоянный ключ из android/keystore/)
#   • windows   — установщик NSIS (MikroTik-Guide-Setup-x.y.z.exe)
#   • release   — при пуше тега vX.Y.Z создаёт релиз с артефактами
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Тесты стенда и контента
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Синтаксис JS
        run: |
          set -e
          for f in app/js/*.js tools/*.js; do node --check "$f"; done
          echo "syntax OK"
      - name: Генерация скриншотов (детерминированность)
        run: |
          node tools/gen-screens.js
          git diff --exit-code -- app/assets/img || {
            echo "::error::SVG-скриншоты отличаются от закоммиченных. Запустите node tools/gen-screens.js и закоммитьте."
            exit 1
          }
      - name: Модульные тесты
        run: node tools/test-stand.js

  android:
    name: Android APK (подписанный)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Сборка release APK
        run: gradle -p android assembleRelease --stacktrace
      - name: Проверка подписи APK
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: MikroTik-Guide-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  windows:
    name: Windows-установщик
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Установка зависимостей
        run: npm install --no-audit --no-fund
      - name: Сборка установщика (electron-builder)
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: MikroTik-Guide-Windows
          path: windows/dist/*.exe
          if-no-files-found: error

  release:
    name: Публикация релиза
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: MikroTik Guide ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
