name: Android published update discovery

# A release is initially a draft. Capture the previously published APK first,
# then wait for the new tag to be verified and deliberately published.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - '.github/workflows/android-update-check.yml'
      - 'tools/test-android-update.sh'

permissions:
  contents: read

jobs:
  android-update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine target version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then target="$GITHUB_REF_NAME"; else
            target=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          fi
          [[ "$target" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "TARGET_TAG=$target" >> "$GITHUB_ENV"
      - name: Download previously published clean APK
        shell: bash
        run: |
          set -euo pipefail
          # Also works if the target was published before the runner started.
          # The latest published tag may have a higher semantic version than
          # TARGET_TAG. Choose the greatest strictly older stable version so the
          # updater is tested as an upgrade, not falsely described as one.
          previous=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '
            def version: ltrimstr("v") | split(".") | map(tonumber);
            (env.TARGET_TAG | version) as $target |
            [.[] | select(.draft == false and .prerelease == false) |
             select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) |
             select((.tag_name | version) < $target)] |
            sort_by(.tag_name | version) | last | .tag_name // empty')
          if [[ -z "$previous" ]]; then echo '::error::No previous published release is available for this test.'; exit 1; fi
          mkdir -p "$RUNNER_TEMP/previous-release"
          gh release download "$previous" -p '*.apk' -D "$RUNNER_TEMP/previous-release"
          mapfile -t apks < <(find "$RUNNER_TEMP/previous-release" -maxdepth 1 -type f -name '*.apk')
          if [[ ${#apks[@]} -ne 1 ]]; then echo '::error::Expected exactly one previous release APK'; exit 1; fi
          cp "${apks[0]}" "$RUNNER_TEMP/previous.apk"
          echo "OLD_APK=$RUNNER_TEMP/previous.apk" >> "$GITHUB_ENV"
          echo "Testing installed $previous -> published $TARGET_TAG"
      - name: Wait for verified draft to be published
        shell: bash
        run: |
          set -euo pipefail
          # A human/agent reviews the draft and publishes it. A failed build or
          # unpublished draft must never be presented as a successful update.
          deadline=$((SECONDS+2100))
          while (( SECONDS < deadline )); do
            latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
            if [[ "$latest" == "$TARGET_TAG" ]]; then exit 0; fi
            sleep 30
          done
          echo '::error::The tagged release was not published as latest within 35 minutes.'
          exit 1
      - name: Download newly published clean APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/target-release"
          gh release download "$TARGET_TAG" -p '*.apk' -D "$RUNNER_TEMP/target-release"
          mapfile -t apks < <(find "$RUNNER_TEMP/target-release" -maxdepth 1 -type f -name '*.apk')
          if [[ ${#apks[@]} -ne 1 ]]; then echo '::error::Expected exactly one target APK'; exit 1; fi
          cp "${apks[0]}" "$RUNNER_TEMP/target.apk"
          echo "NEW_APK=$RUNNER_TEMP/target.apk" >> "$GITHUB_ENV"
      - name: Configure KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify older APK finds the new published version in Android WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: bash tools/test-android-update.sh
      - name: Save UI hierarchy for diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-update-diagnostic
          path: ${{ runner.temp }}/android-update.xml
          if-no-files-found: ignore
          retention-days: 7
