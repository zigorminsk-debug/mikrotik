name: Android text size and menu
on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/android-font-responsive.yml'
      - 'tools/test-android-font.sh'
      - 'tools/export-android-font.py'
      - 'app/css/app.css'
      - 'app/js/app.js'
      - 'app/index.html'
      - 'android/app/build.gradle'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-font:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Build release APK on GitHub
        run: gradle -p android assembleRelease --stacktrace
      - name: Configure KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise actual WebView on narrow Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_FONT_APK: ${{ github.workspace }}/android/app/build/outputs/apk/release/app-release.apk
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: bash tools/test-android-font.sh
      - name: Save disposable emulator hierarchy on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-font-ui
          path: ${{ runner.temp }}/font-ui.xml
          if-no-files-found: ignore
          retention-days: 3
      - name: Prepare screenshot encoder
        if: always()
        run: python3 -m pip install pillow
      - name: Export Android failure screenshot 0–9
        if: always()
        run: python3 tools/export-android-font.py failure 0
      - name: Export Android failure screenshot 10–19
        if: always()
        run: python3 tools/export-android-font.py failure 10
      - name: Export Android menu screenshot 0–9
        if: always()
        run: python3 tools/export-android-font.py menu 0
      - name: Export Android menu screenshot 10–19
        if: always()
        run: python3 tools/export-android-font.py menu 10
      - name: Export Android about screenshot 0–9
        if: always()
        run: python3 tools/export-android-font.py about 0
      - name: Export Android about screenshot 10–19
        if: always()
        run: python3 tools/export-android-font.py about 10
      - name: Export Android reading screenshot 0–9
        if: always()
        run: python3 tools/export-android-font.py reading 0
      - name: Export Android reading screenshot 10–19
        if: always()
        run: python3 tools/export-android-font.py reading 10
      - name: Export Android lab screenshot 0–9
        if: always()
        run: python3 tools/export-android-font.py lab 0
      - name: Export Android lab screenshot 10–19
        if: always()
        run: python3 tools/export-android-font.py lab 10
