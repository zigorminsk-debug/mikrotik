# Research only: this does not bundle the candidate into the application.
name: Windows CHR dual WAN integration
on:
  push:
    paths:
      - '.github/workflows/windows-chr-dual-integration.yml'
      - 'app/js/lab-sim.js'
      - 'tools/chr-ci-fixture.js'
      - 'tools/chr-ci-dual-wan-fixture.js'
      - 'tools/test-chr-dual-wan.js'
      - 'tools/test-chr-dual-integration.js'
      - 'tools/test-chr-ntp.js'
      - 'windows/main.js'
      - 'windows/chr/network-warning.js'
      - 'tools/test-chr-verify.js'
      - 'tools/test-chr-session.js'
      - 'tools/test-chr-internet.js'
      - 'tools/chr-ci-fixture.js'
      - 'windows/chr/session.js'
      - 'windows/chr/online.js'
      - 'tools/test-chr-online.js'
      - 'windows/chr/console.js'
      - 'windows/chr/plan.js'
      - 'tools/windows/chr-supervisor.c'
      - 'windows/chr/verify.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch pinned QEMU installer, verify and extract without installing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'qemu-candidate'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $package = Join-Path $dir 'qemu-setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/dextoros/qemu-runtime/releases/download/qemu-11.1.0-20260811/qemu-w64-setup-20260811.exe' -OutFile $package
          $sha = (Get-FileHash -Algorithm SHA512 $package).Hash.ToLowerInvariant()
          if ($sha -ne '5bcf9eed634e8575a37b74f445af41a2fe4106da512d0c30c368301d4c105037fdfab40a5287367a28a957624cddebbc8c07e16c88ab6634f554cdf3d16bf543') { throw 'QEMU installer SHA-512 mismatch' }
          $dest = Join-Path $dir 'qemu'
          7z x -y "-o$dest" $package
          if ($LASTEXITCODE -ne 0) { throw 'Unable to extract QEMU installer' }
          $exe = @(Get-ChildItem -Recurse -File -Path $dest -Filter qemu-system-x86_64.exe)
          if ($exe.Count -ne 1) { throw 'Expected one QEMU executable' }
          & $exe[0].FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'QEMU failed to start' }
          "QEMU_EXE=$($exe[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $licenses = @(Get-ChildItem -Recurse -File -Path $dest | Where-Object { $_.Name -match '^(COPYING|LICENSE)' } | Select-Object -ExpandProperty FullName)
          Write-Output "::notice title=Extracted QEMU license files::$($licenses.Count)"
      - name: Obtain official CHR for isolated CI only
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'qemu-candidate'
          $zip = Join-Path $dir 'chr.zip'
          Invoke-WebRequest -Uri 'https://download.mikrotik.com/routeros/7.23.8/chr-7.23.8.img.zip' -OutFile $zip
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant() -ne 'ac01ec7c092f4cab8136212e8ebfd613e0a37844c406317fa228d1ad446ce62c') { throw 'CHR ZIP hash mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $dir 'chr')
          $img = @(Get-ChildItem -Recurse -File -Path (Join-Path $dir 'chr') -Filter '*.img')
          if ($img.Count -ne 1) { throw 'Expected one CHR image' }
          "CHR_IMAGE=$($img[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          node tools/chr-ci-fixture.js | Out-File -FilePath (Join-Path $dir 'fixture.json') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Fixture generation failed' }
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build Windows QEMU supervisor
        shell: pwsh
        run: |
          cl /nologo /O2 /W3 tools/windows/chr-supervisor.c "/Fo$env:RUNNER_TEMP/chr-supervisor.obj" /link "/OUT:$env:RUNNER_TEMP/chr-supervisor.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Supervisor compilation failed' }
      - name: Verify application handler against real CHR
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'qemu-candidate'
          node tools/test-chr-dual-integration.js "$env:QEMU_EXE" "$env:CHR_IMAGE" (Join-Path $dir 'integration-sessions') (Join-Path $env:RUNNER_TEMP 'chr-supervisor.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Main-process and real CHR integration failed' }
      - name: Verify isolated NTP settings in two real CHRs (CI only)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'qemu-candidate'
          node tools/test-chr-ntp.js "$env:QEMU_EXE" "$env:CHR_IMAGE" (Join-Path $dir 'ntp-sessions') (Join-Path $env:RUNNER_TEMP 'chr-supervisor.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Isolated NTP settings verification failed' }
