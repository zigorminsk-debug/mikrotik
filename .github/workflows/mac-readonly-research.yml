name: Isolated MAC read-only CHR research
on:
  push:
    branches: ['**'] # Tags run only Build and Android update; branch coverage is unchanged.
    paths:
      - '.github/workflows/mac-readonly-research.yml'
      - 'tools/test-mac-readonly-chr.py'
      - 'tools/mac-readonly-ci/**'
      - 'windows/physical/mndp.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install disposable VM and network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 python3-pexpect iproute2 unzip
      - name: Obtain pinned research source and official CHR
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mac-research"
          curl -fL --retry 2 -o "$RUNNER_TEMP/mac-research/tik4net.tar.gz" https://codeload.github.com/danikf/tik4net/tar.gz/d4597fa04fcad3e96a9fcd51ddac499778344638
          echo '78ee97bbda547e835c329a66d9454417f696f356ba62b75e8f190deb077e896e  '"$RUNNER_TEMP/mac-research/tik4net.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mac-research/tik4net.tar.gz" -C "$RUNNER_TEMP/mac-research"
          echo "TIK_SOURCE=$RUNNER_TEMP/mac-research/tik4net-d4597fa04fcad3e96a9fcd51ddac499778344638" >> "$GITHUB_ENV"
          curl -fL --retry 2 -o "$RUNNER_TEMP/mac-research/chr.zip" https://download.mikrotik.com/routeros/7.23.8/chr-7.23.8.img.zip
          echo 'ac01ec7c092f4cab8136212e8ebfd613e0a37844c406317fa228d1ad446ce62c  '"$RUNNER_TEMP/mac-research/chr.zip" | sha256sum -c -
          unzip -o "$RUNNER_TEMP/mac-research/chr.zip" -d "$RUNNER_TEMP/mac-research"
      - name: Build read-only research client (not part of the app)
        run: |
          dotnet publish tools/mac-readonly-ci/mac-readonly-ci.csproj -c Release -r linux-x64 --self-contained true -p:TikSource="$TIK_SOURCE" -o "$RUNNER_TEMP/mac-research/helper"
      - name: Test MNDP and MAC WinBox inside isolated namespace
        run: |
          set -euo pipefail
          ns="chr-mac-ci"
          trap 'sudo ip netns del "$ns" || true; sudo rm -rf "$RUNNER_TEMP/mac-research/session"' EXIT
          sudo ip netns add "$ns"
          sudo ip netns exec "$ns" ip link set lo up
          sudo ip netns exec "$ns" ip tuntap add dev tap0 mode tap
          sudo ip netns exec "$ns" ip addr add 192.0.2.1/24 dev tap0
          sudo ip netns exec "$ns" ip link set tap0 up
          # No veth, bridge or default route to the runner's real network.
          sudo ip netns exec "$ns" /usr/bin/python3 tools/test-mac-readonly-chr.py "$RUNNER_TEMP/mac-research/chr-7.23.8.img" "$RUNNER_TEMP/mac-research/session" "$RUNNER_TEMP/mac-research/helper/mac-readonly-ci"
